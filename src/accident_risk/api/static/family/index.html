<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RoadSense — Family</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #0b0f14; color: #e7edf3; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    padding: 16px; box-sizing: border-box;
  }
  .card {
    max-width: 420px; width: 100%; background: #11161d; border: 1px solid #222b35;
    border-radius: 14px; padding: 28px 24px; text-align: center;
  }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { color: #9fb0c0; line-height: 1.5; font-size: 14px; }
  .status { font-size: 15px; margin: 18px 0 6px; font-weight: 600; }
  .status.ok { color: #4fd18b; }
  .status.err { color: #e05a3a; }
</style>
</head>
<body>
  <div class="card">
    <h1>RoadSense</h1>
    <p id="message">Checking your link…</p>
    <div id="status"></div>
  </div>

<script>
  const token = decodeURIComponent(location.pathname.split("/family/")[1] || "");
  const messageEl = document.getElementById("message");
  const statusEl = document.getElementById("status");

  async function post(path, body) {
    const response = await fetch(`/app/api${path}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    return { ok: response.ok, status: response.status, data: await response.json().catch(() => ({})) };
  }

  async function init() {
    if (!token) {
      messageEl.textContent = "This link is missing its invite code.";
      statusEl.innerHTML = '<div class="status err">Invalid link</div>';
      return;
    }

    const acknowledge = await post("/family/acknowledge", { token });
    if (acknowledge.ok) {
      messageEl.textContent = "Thanks — we've recorded that you've seen this notification.";
      statusEl.innerHTML = '<div class="status ok">Acknowledged</div>';
      return;
    }

    messageEl.textContent = "This link has already been used or is no longer valid.";
    statusEl.innerHTML = '<div class="status err">Link not valid</div>';
  }

  init();
</script>
</body>
</html>
