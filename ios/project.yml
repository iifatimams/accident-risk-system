name: RoadSense
options:
  bundleIdPrefix: ae.aus
  deploymentTarget:
    iOS: "17.0"
targets:
  RoadSense:
    type: application
    platform: iOS
    sources:
      - path: RoadSense
    info:
      path: RoadSense/Info.plist
      properties:
        NSBluetoothAlwaysUsageDescription: RoadSense connects to the vehicle OBD and WHOOP
          strap via Bluetooth
        NSLocationAlwaysAndWhenInUseUsageDescription: RoadSense collects driving telemetry
          in the background
        NSLocationWhenInUseUsageDescription: RoadSense requires GPS during active drives
        NSMotionUsageDescription: RoadSense monitors vehicle dynamics using phone motion sensors
        NSCameraUsageDescription: RoadSense uses the front and rear cameras to detect driver
          distraction and road traffic
        UIBackgroundModes:
        - location
        - bluetooth-central
        - processing
        NSLocalNetworkUsageDescription: RoadSense connects to your selected local development
          backend.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: RoadSense/RoadSense.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ae.aus.roadsense.fatima
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: false